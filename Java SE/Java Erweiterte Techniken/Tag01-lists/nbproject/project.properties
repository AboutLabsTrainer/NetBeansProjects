# NetBeans Project Properties
# Diese Datei wird von NetBeans verwendet, um das Projekt zu konfigurieren

build.generated.sources.dir=${build.dir}/generated-sources
debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
excludes=
includes=**
javac.modulepath=
javac.processormodulepath=
javac.test.modulepath=\
    ${javac.modulepath}
# Projekt-Informationen
project.name=01-collections-lists
project.type=java
project.encoding=UTF-8

run.modulepath=\
    ${javac.modulepath}
run.test.modulepath=\
    ${javac.test.modulepath}
# Quellverzeichnisse
src.dir=src
src.binary.encoding=UTF-8

# Build-Verzeichnisse
build.dir=build
build.classes.dir=${build.dir}/classes
dist.dir=dist
dist.jar=${dist.dir}/${project.name}.jar

# Java-Version
javac.source=11
javac.target=11
javac.compilerargs=-Xlint:unchecked

# Main-Klasse (kann in NetBeans geändert werden)
main.class=de.ibb.collections.todo.ui.TodoAppConsole

# Libraries (falls benötigt)
libs.CopyLibs.classpath=
