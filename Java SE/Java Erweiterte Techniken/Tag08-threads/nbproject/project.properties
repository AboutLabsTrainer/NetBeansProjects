# NetBeans Project Properties for tag08-annotations-threads

build.generated.sources.dir=${build.dir}/generated-sources
debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
excludes=
includes=**
javac.modulepath=
javac.processormodulepath=
javac.test.modulepath=\
    ${javac.modulepath}

# Projekt-Informationen
project.name=tag08-annotations-threads
project.type=java
project.encoding=UTF-8

run.modulepath=\
    ${javac.modulepath}
run.test.modulepath=\
    ${javac.test.modulepath}

# Quellverzeichnisse
src.dir=src
src.binary.encoding=UTF-8

# Build-Verzeichnisse
build.dir=build
build.classes.dir=${build.dir}/classes
dist.dir=dist
dist.jar=${dist.dir}/${project.name}.jar

# Java-Version
javac.source=21
javac.target=21
javac.compilerargs=-Xlint:unchecked

# Main-Klasse
main.class=de.ibb.tag08.App

# Libraries (falls benötigt)
libs.CopyLibs.classpath=

platform.active=JDK_21
