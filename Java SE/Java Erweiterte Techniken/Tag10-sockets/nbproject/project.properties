# Projekt-Eigenschaften für NetBeans
# Tag 10 - Netzwerkprogrammierung: Sockets & HttpClient

build.generated.sources.dir=${build.dir}/generated-sources
debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
excludes=
includes=**
javac.modulepath=
javac.processormodulepath=
javac.test.modulepath=\
    ${javac.modulepath}
# Projekt-Name
project.name=10-netzwerkprogrammierung-sockets

run.modulepath=\
    ${javac.modulepath}
run.test.modulepath=\
    ${javac.test.modulepath}
# Source-Verzeichnisse
src.dir=src
test.src.dir=test

# Build-Verzeichnisse
build.dir=build
dist.dir=dist

# Java-Version
javac.source=21
javac.target=21
javac.encoding=UTF-8

# Compiler-Optionen
javac.compilerargs=-Xlint:all
javac.deprecation=true
javac.debug=true

# Classpath (für externe JARs)
javac.classpath=

# Main-Klassen (für Run-Konfigurationen)
main.class=de.ibb.netzwerk.tag10.EchoServerLevel1

# Run-Argumente (optional)
run.args=

# JVM-Argumente (optional)
run.jvmargs=

# Platform (Java SE)
platform.active=JDK_21

# Ant Build-Script
ant.build.file=build.xml

# Ant Targets
ant.build.target=default

# Projekt-Typ
project.type=java-se
