# Application
spring.application.name=person-management

# Database - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ibb-db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ibb-user
spring.datasource.password=ibb-pw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=MyVerySecretKeyForJWTTokenGenerationThatMustBeLongEnoughForHS256Algorithm
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

# Server
server.port=8080
