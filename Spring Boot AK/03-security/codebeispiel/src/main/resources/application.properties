# Application
spring.application.name=person-management

# Database - MariaDB (default)
spring.datasource.url=jdbc:mariadb://localhost:3306/jsprbak_tag04_security?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=jsprbak_tag04_security
spring.datasource.password=jsprbak_tag04_security
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=MyVerySecretKeyForJWTTokenGenerationThatMustBeLongEnoughForHS256Algorithm
app.jwt.expiration=3600000
app.jwt.refresh-expiration=604800000

# Server
server.port=8080
