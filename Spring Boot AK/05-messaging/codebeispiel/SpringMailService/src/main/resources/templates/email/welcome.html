<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Willkommen</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 32px; border-radius: 8px;">
    <h1 style="color: #1a365d;">Willkommen!</h1>
    <p>Hallo <strong th:text="${username}">Gast</strong>,</p>
    <p>schön, dass du dabei bist. Deine Registrierung war erfolgreich.</p>
    <p>Deine E-Mail-Adresse: <span th:text="${email}">email@example.com</span></p>
    <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 24px 0;"/>
    <p style="color: #718096; font-size: 12px;">
        Diese E-Mail wurde automatisch versendet.
    </p>
</div>
</body>
</html>
