server.port=8080

# Datasource – H2 in-memory
spring.datasource.url=jdbc:h2:mem:actuatordb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# Mail (Platzhalter – echter SMTP-Check optional)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
health.email.check-connection=false
# Built-in MailHealthIndicator braucht echten SMTP – eigenes Indicator reicht
management.health.mail.enabled=false

# External API Health prüft lokalen Ping-Endpoint
external.api.url=http://localhost:8080/api

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,database-queries
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=User Management API
info.app.version=1.0.0
info.app.description=Spring Boot Aufbau - Tag 9

# Prometheus
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
