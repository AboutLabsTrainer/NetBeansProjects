# ============================================
# Spring Boot Basic Tag 2 - Configuration
# Java Fleet Systems Consulting
# ============================================

# Server Configuration
server.port=8081
spring.application.name=spring-boot-basic-tag2

# Logging Configuration
logging.level.root=INFO
logging.level.de.ibb.springbootbasic=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Jackson JSON Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Banner Configuration
spring.main.banner-mode=console

# DevTools Configuration (Hot Reload)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ============================================
# Custom Properties (für später)
# ============================================
app.name=Spring Boot Basic Tag 2
app.description=Der Spring Container & Dependency Injection
app.version=1.0.0
app.author=Elyndra Valen
app.company=Java Fleet Systems Consulting
