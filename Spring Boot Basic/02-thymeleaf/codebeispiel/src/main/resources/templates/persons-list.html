<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Personen-Liste - Spring Boot Basic Tag 3</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <header>
        <h1>Personen-Liste</h1>
        <p class="subtitle">Spring Boot Basic - Tag 3: Thymeleaf Views</p>
    </header>

    <main class="container">
        <div class="stats">
            <div class="stat-card">
                <span class="stat-label">Gesamt:</span>
                <span class="stat-value" th:text="${totalPersons}">100</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Seite:</span>
                <span class="stat-value">
                    <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">10</span>
                </span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Pro Seite:</span>
                <span class="stat-value" th:text="${pageSize}">10</span>
            </div>
        </div>

        <form th:action="@{/persons}" method="get" class="search-form">
            <input type="text" name="search" th:value="${search}" placeholder="Vor- oder Nachname suchen..."
                   th:placeholder="'Vor- oder Nachname suchen...'"/>
            <input type="hidden" name="sort" th:value="${currentSort}"/>
            <input type="hidden" name="order" th:value="${currentOrder}"/>
            <button type="submit" class="btn btn-primary">Suchen</button>
            <a th:href="@{/persons}" class="btn btn-secondary">Zurücksetzen</a>
        </form>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>
                            <a th:href="@{/persons(sort='id', order=${currentSort == 'id' && currentOrder == 'asc' ? 'desc' : 'asc'}, search=${search})}">
                                ID
                                <span class="sort-indicator" th:if="${currentSort == 'id'}" th:text="${currentOrder == 'asc' ? '↑' : '↓'}"></span>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/persons(sort='firstname', order=${currentSort == 'firstname' && currentOrder == 'asc' ? 'desc' : 'asc'}, search=${search})}">
                                Vorname
                                <span class="sort-indicator" th:if="${currentSort == 'firstname'}" th:text="${currentOrder == 'asc' ? '↑' : '↓'}"></span>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/persons(sort='lastname', order=${currentSort == 'lastname' && currentOrder == 'asc' ? 'desc' : 'asc'}, search=${search})}">
                                Nachname
                                <span class="sort-indicator" th:if="${currentSort == 'lastname'}" th:text="${currentOrder == 'asc' ? '↑' : '↓'}"></span>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/persons(sort='email', order=${currentSort == 'email' && currentOrder == 'asc' ? 'desc' : 'asc'}, search=${search})}">
                                E-Mail
                                <span class="sort-indicator" th:if="${currentSort == 'email'}" th:text="${currentOrder == 'asc' ? '↑' : '↓'}"></span>
                            </a>
                        </th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="person, iterStat : ${persons}"
                        th:class="${iterStat.odd} ? 'odd-row' : 'even-row'">
                        <td th:text="${person.id}">1</td>
                        <td th:text="${person.firstname}">Max</td>
                        <td th:text="${person.lastname}">Mustermann</td>
                        <td th:text="${person.email}">max@example.com</td>
                        <td>
                            <a th:href="@{/persons/{id}(id=${person.id})}" class="btn btn-small">Details →</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination">
            <a th:if="${currentPage > 0}"
               th:href="@{/persons(page=${currentPage - 1}, size=${pageSize}, search=${search}, sort=${currentSort}, order=${currentOrder})}"
               class="btn btn-secondary">← Zurück</a>
            <span class="page-info">
                Seite <strong th:text="${currentPage + 1}">1</strong> von <strong th:text="${totalPages}">10</strong>
            </span>
            <a th:if="${currentPage + 1 < totalPages}"
               th:href="@{/persons(page=${currentPage + 1}, size=${pageSize}, search=${search}, sort=${currentSort}, order=${currentOrder})}"
               class="btn btn-secondary">Weiter →</a>
        </div>
    </main>

    <footer>
        <p>Spring Boot Basic</p>
        <p>
            <a th:href="@{/api/persons}">JSON API anzeigen</a> |
            <a th:href="@{/hello}">Hello Test</a>
        </p>
    </footer>
</body>
</html>
