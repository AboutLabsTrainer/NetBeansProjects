<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring Boot Chat</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">

    <style>
        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #111;
        }

        #chat-page { display: none; }

        .chat-container {
            width: 100%;
            max-width: 760px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .chat-header {
            background: #111;
            color: #fff;
            padding: 18px 20px;
        }

        .chat-messages {
            height: 420px;
            overflow-y: auto;
            padding: 18px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            max-width: 75%;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .message.own {
            background: #111;
            color: #fff;
            margin-left: auto;
            text-align: right;
        }

        .message.other {
            background: #fff;
            border: 1px solid #ccc;
            color: #111;
        }

        .message.event {
            background: #eee;
            color: #555;
            text-align: center;
            margin: 10px auto;
            font-style: italic;
            font-size: 0.85rem;
            max-width: 100%;
            border-radius: 4px;
        }

        .login-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 2.5rem;
        }

        .login-card h2 {
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .form-control {
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-control:focus {
            border-color: #111;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.08);
        }

        .btn-dark {
            background: #111;
            border-color: #111;
            border-radius: 4px;
        }

        .btn-dark:hover {
            background: #333;
            border-color: #333;
        }

        .btn-outline-light {
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div id="username-page" class="w-100" style="max-width: 420px;">
    <div class="login-card">
        <h2 class="mb-4">Chat</h2>
        <form id="usernameForm">
            <label for="username" class="form-label">Dein Name</label>
            <input type="text" id="username" class="form-control mb-3" placeholder="z.B. Alice" required autocomplete="nickname">
            <button type="submit" class="btn btn-dark w-100">Beitreten</button>
        </form>
    </div>
</div>

<div id="chat-page" class="chat-container">
    <div class="chat-header">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <div class="h5 mb-0" style="font-weight: 600;">Chat</div>
                <small id="connected-user" style="opacity: 0.7;"></small>
            </div>
            <button id="disconnectBtn" type="button" class="btn btn-sm btn-outline-light">Disconnect</button>
        </div>
    </div>

    <div id="chat-messages" class="chat-messages"></div>

    <div class="p-3 border-top" style="background: #fff;">
        <form id="messageForm">
            <div class="input-group">
                <input type="text" id="message" class="form-control" placeholder="Nachricht..." autocomplete="off">
                <button type="submit" class="btn btn-dark">Senden</button>
            </div>
        </form>
        <div id="status" class="small mt-2" style="color: #888;"></div>
    </div>
</div>

<script th:src="@{/webjars/sockjs-client/1.5.1/sockjs.min.js}"></script>
<script th:src="@{/webjars/stomp-websocket/2.3.4/stomp.min.js}"></script>

<script>
    let stompClient = null;
    let currentUser = null;

    const usernamePage = document.querySelector('#username-page');
    const chatPage = document.querySelector('#chat-page');
    const usernameForm = document.querySelector('#usernameForm');
    const messageForm = document.querySelector('#messageForm');
    const messageInput = document.querySelector('#message');
    const chatMessages = document.querySelector('#chat-messages');
    const connectedUser = document.querySelector('#connected-user');
    const statusEl = document.querySelector('#status');
    const disconnectBtn = document.querySelector('#disconnectBtn');

    function setStatus(text) {
        statusEl.textContent = text || '';
    }

    usernameForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const name = document.querySelector('#username').value.trim();

        if (!name) return;
        currentUser = name;
        connectedUser.textContent = 'Verbunden als ' + currentUser;

        usernamePage.style.display = 'none';
        chatPage.style.display = 'block';
        connect();
    });

    disconnectBtn.addEventListener('click', function () {
        if (stompClient) {
            stompClient.disconnect(function () {
                setStatus('Disconnected');
            });
        }
        stompClient = null;

        chatMessages.innerHTML = '';
        chatPage.style.display = 'none';
        usernamePage.style.display = 'block';
    });

    function connect() {
        setStatus('Verbinde...');

        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, onConnected, onError);
    }

    function onConnected() {
        setStatus('Verbunden');
        stompClient.subscribe('/topic/public', onMessageReceived);

        stompClient.send('/app/chat.join', {}, JSON.stringify({sender: currentUser, type: 'JOIN'}));
        messageInput.focus();
    }

    function onError(error) {
        console.error('WebSocket Error:', error);
        setStatus('Fehler: Verbindung fehlgeschlagen (siehe Console)');
    }

    messageForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const content = messageInput.value.trim();

        if (content && stompClient) {
            stompClient.send('/app/chat.send', {}, JSON.stringify({sender: currentUser, content: content, type: 'CHAT'}));
            messageInput.value = '';
        }
    });

    function onMessageReceived(payload) {
        const message = JSON.parse(payload.body);
        const messageElement = document.createElement('div');

        if (message.type === 'JOIN' || message.type === 'LEAVE') {
            messageElement.classList.add('message', 'event');
            messageElement.textContent = message.content || '';
        } else {
            messageElement.classList.add('message');
            messageElement.classList.add(message.sender === currentUser ? 'own' : 'other');
            const sender = message.sender ? (message.sender + ': ') : '';
            messageElement.textContent = sender + (message.content || '');
        }

        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>

</body>
</html>
