<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Chat</title>
</head>
<body>
<h1>WebSocket Chat</h1>

<p>
    <a th:href="@{/persons}">Back to Persons</a>
</p>

<div>
    <label for="from">Name:</label>
    <input type="text" id="from" value="User1"/>
</div>
<div>
    <label for="message">Message:</label>
    <input type="text" id="message"/>
    <button type="button" onclick="sendMessage()">Send</button>
</div>

<h2>Messages</h2>
<ul id="messages"></ul>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    let stompClient = null;

    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function () {
            stompClient.subscribe('/topic/public', function (message) {
                const body = JSON.parse(message.body);
                showMessage(body.from + ': ' + body.text);
            });
        });
    }

    function sendMessage() {
        const from = document.getElementById('from').value || 'Anonymous';
        const text = document.getElementById('message').value;
        if (!text) {
            return;
        }
        stompClient.send('/app/chat.send', {}, JSON.stringify({from: from, text: text}));
        document.getElementById('message').value = '';
    }

    function showMessage(message) {
        const li = document.createElement('li');
        li.innerText = message;
        document.getElementById('messages').appendChild(li);
    }

    connect();
</script>

</body>
</html>
