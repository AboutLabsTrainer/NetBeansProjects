spring.application.name=DataLoader_D

### we support switching our user-base from database (default) to json
app.auth.mode=database

### DATABASE ###
#>>> COMMON PART <<<#
#:# User and password to access & administrate the database
spring.datasource.username=sa
spring.datasource.password=password

#:# Allow running a sql-script from resources/ on startup (defaults to "data.sql")
spring.sql.init.mode=always

#>>> JPA <<<#
#:# Auto-generate tables from Java-Entities (JPA)
spring.jpa.hibernate.ddl-auto=create-drop
#:# Wait until JPA built the table structure, before running the script.
spring.jpa.defer-datasource-initialization=true

#>>> DB-SPECIFIC <<<
##  NOTE: we're using an H2 database. Settings might (*will*) differ for different databases. ##
#:# Set driver
spring.datasource.driver-class-name=org.h2.Driver

#:# Assign fixed URL for in-memory database (volatile)
spring.datasource.url=jdbc:h2:mem:testdb
#:# Assign fixed URL for file-based database (persistent)
#:> This would save to a file testme.mv.db in the users home directory
# spring.datasource.url=jdbc:h2:file:~/testme
#:# by using a semicolon, you can append some info or features settings to the URL
# ...running scripts:           ...;INIT=RUNSCRIPT FROM 'users.sql'
# ...setting a database name:   ...;databaseName=dataloader

#:# Activate H2 gui console and we can use it at http://localhost:8080/h2-console
spring.h2.console.enabled=true
# ... additional console settings:
#spring.h2.console.path=/h2-console
#spring.h2.console.settings.trace=false
#spring.h2.console.settings.web-allow-others=false


